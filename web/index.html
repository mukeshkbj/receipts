<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts — claims in, verdicts out</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  body { background:#0a0a0b; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge { font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:2px 8px; border-radius:3px; border:1px solid; font-weight:600; white-space:nowrap; }
  .v-measured     { color:#4ade80; border-color:#166534; background:#052e16; }
  .v-cited        { color:#60a5fa; border-color:#1e40af; background:#0c1a3d; }
  .v-contradicted { color:#f87171; border-color:#991b1b; background:#2a0a0a; }
  .v-unverifiable { color:#fbbf24; border-color:#92400e; background:#231803; }
  .v-pending      { color:#71717a; border-color:#3f3f46; background:#18181b; }
  .stage { color:#a1a1aa; }
  .trace-line { animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity:0; transform:translateY(2px);} to { opacity:1;} }
  .card { background:#111113; border:1px solid #232326; }
  .claim-row:hover { background:#16161a; cursor:pointer; }
  .claim-row.active { background:#1a1a20; box-shadow: inset 2px 0 0 #6366f1; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#2a2a2e; border-radius:4px; }
</style>
</head>
<body class="text-zinc-200 min-h-screen">
<div class="max-w-6xl mx-auto px-6 py-8">

  <header class="flex items-baseline gap-4 mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-white">RECEIPTS</h1>
    <p class="text-sm text-zinc-500">claims in, verdicts out — a due-diligence agent for any purchase</p>
  </header>

  <!-- input -->
  <section id="input-card" class="card rounded-lg p-5 mb-6">
    <label class="text-xs uppercase tracking-widest text-zinc-500">What are you buying?</label>
    <textarea id="brief" rows="3" class="mono w-full mt-2 bg-transparent text-sm text-zinc-100 outline-none resize-y placeholder:text-zinc-600"
      placeholder="we need a managed vector database under $500/mo for ~10M vectors, p99 query latency under 50ms"></textarea>
    <div class="flex items-center justify-between mt-3">
      <div class="flex gap-2 text-xs">
        <button class="ex text-zinc-500 hover:text-zinc-300 underline decoration-dotted">vector db</button>
        <button class="ex text-zinc-500 hover:text-zinc-300 underline decoration-dotted">e-signature</button>
        <button class="ex text-zinc-500 hover:text-zinc-300 underline decoration-dotted">project management</button>
      </div>
      <button id="run-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2 rounded">Run diligence →</button>
    </div>
  </section>

  <!-- recent runs -->
  <section id="recent" class="hidden mb-6">
    <h2 class="text-xs uppercase tracking-widest text-zinc-500 mb-2">past diligence runs</h2>
    <div id="recent-list" class="space-y-1"></div>
  </section>

  <!-- live -->
  <section id="live" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-1">
      <h2 class="text-xs uppercase tracking-widest text-zinc-500 mb-2">agent trace</h2>
      <div id="trace" class="card rounded-lg p-3 h-[560px] overflow-y-auto mono text-xs space-y-1"></div>
    </div>
    <div class="lg:col-span-2">
      <div id="result"></div>
    </div>
  </section>

  <!-- evidence drawer -->
  <div id="drawer" class="hidden fixed bottom-0 left-0 right-0 bg-[#131316] border-t border-zinc-700 max-h-72 overflow-y-auto z-10">
    <div class="max-w-6xl mx-auto px-6 py-4">
      <div class="flex justify-between items-start">
        <div>
          <div id="drawer-claim" class="text-sm text-zinc-100 font-medium"></div>
          <div id="drawer-verdict" class="mt-1"></div>
        </div>
        <button id="drawer-close" class="text-zinc-500 hover:text-zinc-200 text-lg leading-none">×</button>
      </div>
      <div id="drawer-ev" class="mt-3 space-y-2"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V = v => `<span class="badge v-${v||'pending'}">${v||'pending'}</span>`;

const EXAMPLES = {
  'vector db': 'we need a managed vector database under $500/mo for ~10M vectors, p99 query latency under 50ms',
  'e-signature': 'we need an e-signature tool for a 30-person startup, must have SOC2 and a real free tier',
  'project management': 'we need project management software for a 12-person eng team, under $15/seat/mo, must have an API and good uptime',
};
document.querySelectorAll('.ex').forEach(b => b.onclick = () => { $('#brief').value = EXAMPLES[b.textContent]; });

let runId = null, lastTrace = 0, polling = null, loaded = false;

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  if (!runs.length) return;
  $('#recent').classList.remove('hidden');
  $('#recent-list').innerHTML = runs.map(r => `
    <button class="run-link block w-full text-left card rounded px-3 py-2 text-sm hover:border-zinc-600 transition-colors" data-id="${r.id}">
      <span class="text-zinc-300">${esc(r.brief.slice(0, 90))}</span>
      <span class="text-xs ml-2 ${r.status==='done'?'text-emerald-500':r.status==='error'?'text-red-400':'text-amber-400'}">${r.status}</span>
    </button>`).join('');
  document.querySelectorAll('.run-link').forEach(b => b.onclick = () => {
    runId = b.dataset.id; lastTrace = 0; loaded = false;
    $('#live').classList.remove('hidden');
    $('#trace').innerHTML = ''; $('#result').innerHTML = '';
    clearInterval(polling); polling = setInterval(poll, 1500); poll();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
}
loadRuns();

$('#run-btn').onclick = async () => {
  const brief = $('#brief').value.trim();
  if (brief.length < 10) return;
  $('#run-btn').disabled = true; $('#run-btn').textContent = 'running…';
  const r = await fetch('/api/runs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({brief})});
  const d = await r.json();
  if (!d.run_id) { $('#run-btn').disabled = false; $('#run-btn').textContent = 'Run diligence →'; alert(d.error||'failed'); return; }
  runId = d.run_id; lastTrace = 0; loaded = false;
  $('#live').classList.remove('hidden');
  $('#trace').innerHTML = ''; $('#result').innerHTML = '';
  $('#input-card').classList.add('opacity-50');
  polling = setInterval(poll, 1500); poll();
};

async function poll() {
  const r = await fetch(`/api/runs/${runId}?since=${lastTrace}`);
  const d = await r.json();
  for (const t of d.trace) {
    lastTrace = Math.max(lastTrace, t.id);
    const line = document.createElement('div');
    line.className = 'trace-line';
    line.innerHTML = `<span class="stage">[${esc(t.stage)}]</span> ${esc(t.event)}${t.detail ? `<div class="text-zinc-600 pl-16 truncate" title="${esc(t.detail)}">${esc(t.detail.slice(0,160))}</div>` : ''}`;
    $('#trace').appendChild(line);
    $('#trace').scrollTop = $('#trace').scrollHeight;
  }
  if (d.run.status !== 'running') {
    clearInterval(polling);
    $('#run-btn').disabled = false; $('#run-btn').textContent = 'Run diligence →';
    $('#input-card').classList.remove('opacity-50');
    renderResult();
    loadRuns();
  }
}

async function renderResult() {
  const d = await (await fetch(`/api/runs/${runId}/result`)).json();
  if (loaded) return; loaded = true;
  const b = d.brief || {};
  const cands = (d.candidates||[]).slice().sort((a,b2) => (b2.weighted||0)-(a.weighted||0));
  let html = '';
  if (b.recommendation) {
    html += `<div class="card rounded-lg p-5 mb-4 border-l-2 border-l-indigo-500">
      <div class="text-xs uppercase tracking-widest text-zinc-500">recommendation</div>
      <div class="text-xl font-semibold text-white mt-1">${esc(b.recommendation)}</div>
      <p class="text-sm text-zinc-400 mt-1">${esc(b.summary||'')}</p>
      ${(b.watch_outs||[]).length ? `<ul class="mt-2 text-xs text-amber-400/90 space-y-1">${b.watch_outs.map(w=>`<li>⚠ ${esc(w)}</li>`).join('')}</ul>`:''}
    </div>`;
  }
  for (const c of cands) {
    const vc = {};
    (c.claims||[]).forEach(cl => vc[cl.verdict||'unverifiable'] = (vc[cl.verdict||'unverifiable']||0)+1);
    html += `<div class="card rounded-lg p-4 mb-4">
      <div class="flex items-center justify-between">
        <div><span class="font-semibold text-white">${esc(c.name)}</span>
          <span class="text-xs text-zinc-500 ml-2">${esc(c.vendor)}</span></div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-zinc-500">${vc.measured||0} measured · ${vc.cited||0} cited · <span class="text-red-400">${vc.contradicted||0} contradicted</span> · ${vc.unverifiable||0} unverifiable</span>
          <span class="text-lg font-bold ${c.weighted>=3.5?'text-emerald-400':c.weighted>=2.5?'text-amber-400':'text-red-400'}">${(c.weighted||0).toFixed(1)}</span>
        </div>
      </div>
      <div class="text-xs text-zinc-500 mt-1">${esc(c.notes||'')}</div>
      <table class="w-full mt-3 text-sm">
        ${(c.claims||[]).map(cl => `
          <tr class="claim-row border-t border-zinc-800/60" data-cand="${c.id}" data-claim="${cl.id}">
            <td class="py-2 pr-3 text-zinc-300">${esc(cl.text)}</td>
            <td class="py-2 text-right whitespace-nowrap">${V(cl.verdict)}</td>
          </tr>`).join('')}
      </table>
    </div>`;
  }
  if ((d.outreach||[]).length) {
    html += `<h3 class="text-xs uppercase tracking-widest text-zinc-500 mt-6 mb-2">drafted outreach</h3>`;
    for (const o of d.outreach) {
      const c = cands.find(x => x.id === o.candidate_id) || {};
      let qs = []; try { qs = JSON.parse(o.questions||'[]'); } catch(e) {}
      html += `<div class="card rounded-lg p-4 mb-3">
        <div class="text-sm font-medium text-zinc-200">→ ${esc(c.name||'')}: ${esc(o.subject)}</div>
        <pre class="mono text-xs text-zinc-400 mt-2 whitespace-pre-wrap">${esc(o.body)}</pre>
        ${qs.length ? `<ul class="mt-2 text-xs text-zinc-400 space-y-1">${qs.map(q=>`<li class="text-indigo-300">? ${esc(q)}</li>`).join('')}</ul>`:''}
      </div>`;
    }
  }
  $('#result').innerHTML = html || '<div class="text-zinc-500 text-sm">no result</div>';
  window._result = d;
  document.querySelectorAll('.claim-row').forEach(row => row.onclick = () => openDrawer(row));
}

function openDrawer(row) {
  document.querySelectorAll('.claim-row.active').forEach(x => x.classList.remove('active'));
  row.classList.add('active');
  const d = window._result;
  const cand = d.candidates.find(c => c.id == row.dataset.cand);
  const cl = (cand.claims||[]).find(x => x.id == row.dataset.claim);
  $('#drawer-claim').textContent = cl.text;
  $('#drawer-verdict').innerHTML = V(cl.verdict) + (cl.rationale ? ` <span class="text-xs text-zinc-500 ml-2">${esc(cl.rationale)}</span>` : '');
  $('#drawer-ev').innerHTML = (cl.evidence||[]).length
    ? cl.evidence.map(e => `<div class="card rounded p-3 text-xs">
        <div class="flex gap-2 items-center text-zinc-500">
          <span class="badge v-pending">${esc(e.check_name)}</span><span>${esc(e.kind)}</span>
          ${e.url ? `<a class="text-indigo-400 hover:underline truncate max-w-xs" href="${esc(e.url)}" target="_blank">${esc(e.url)}</a>`:''}
          ${e.supports===1?'<span class="text-emerald-400">supports</span>':e.supports===-1?'<span class="text-red-400">contradicts</span>':'<span class="text-zinc-500">neutral</span>'}
        </div>
        ${e.excerpt?`<div class="text-zinc-400 mt-1">${esc(e.excerpt)}</div>`:''}
        ${e.measured_value?`<div class="mono text-emerald-300/80 mt-1">${esc(e.measured_value)}</div>`:''}
      </div>`).join('')
    : '<div class="text-zinc-500 text-xs">no evidence attached</div>';
  $('#drawer').classList.remove('hidden');
}
$('#drawer-close').onclick = () => $('#drawer').classList.add('hidden');
</script>
</body>
</html>
